<script>

        function AddDetails()
        {
              var servicename=document.getElementById("sname").value;
              var servicedesc=document.getElementById("sdesc").value;
              var servicephoto=document.getElementById("sphoto").files[0];
              var serviceprice=document.getElementById("sprice").value;
              var sofferprice=document.getElementById("sofferprice").value;
              var stype=document.getElementById("stype").value;
              
               if(servicename==="" || servicedesc==="" || !servicephoto|| serviceprice==="" || sofferprice==="" || stype==="")
               {
                       Swal.fire({
    title: "Incomplete Form",
    text: "Please fill in all the required details.",
    icon: "warning",
    confirmButtonColor: "#d63384",
    background: "#fff"
});
               }
               
  else if(isNaN(serviceprice) || isNaN(sofferprice))
{
      Swal.fire({
          title: "Invalid Price",
          text: "Please enter valid numeric prices.",
          icon: "error",
          confirmButtonColor: "#d63384",
          background: "#fff"
      });
}

else if(Number(sofferprice) > Number(serviceprice))
{
      Swal.fire({
          title: "Invalid Offer Price",
          text: "Offer price cannot be greater than original price.",
          icon: "warning",
          confirmButtonColor: "#d63384",
          background: "#fff"
      });
}
               else
               {
                   var formdata=new FormData();
              
                   formdata.append("servicename",servicename);
                   formdata.append("servicedesc",servicedesc);
                   formdata.append("servicephoto",servicephoto);
                   formdata.append("serviceprice",serviceprice);
                   formdata.append("sofferprice",sofferprice);
                   formdata.append("stype",stype);
              
                var url="/AddServiceDetails";
                fetch(url,
                {
                   method:"POST",
                   body:formdata
                })
               .then(response=>response.text())
                         .then(ans=>renderAsHTML(ans));
             }
    }
    
         function renderAsHTML(ans)
         {
              console.log(ans);
               if(ans==="success")
               {
                      Swal.fire({
            title: "Success!",
            text: "Service Added Successfully",
            icon: "success",
            confirmButtonColor: "#d63384"
      });

      ShowData1();
               }
               else
               {
                      Swal.fire({
            title: "Something Went Wrong",
            text: "Service could not be added. Please try again.",
            icon: "error",
            confirmButtonColor: "#d63384"
      });
               
         }
     }
                function deleteData(id)
                {
                        console.log(id);
                         var formdata=new FormData();
                         formdata.append("id_del1",id);
                         
                        var url="/DeleteService";
                        
                        fetch(url,
                        {
                             method:"POST",
                             body:formdata
                        })
                                .then(response=>response.text())
                                .then(ans3=>renderHTML(ans3));
                            
                }
                
          function renderHTML(ans3)
         {
                           if(ans3 === "success")
{
    Swal.fire({
        icon: 'success',
        title: 'Deleted!',
        text: 'Service deleted successfully.',
        confirmButtonColor: '#d63384'
    });

    ShowData1();
}
else
{
    Swal.fire({
        icon: 'error',
        title: 'Error!',
        text: 'Service could not be deleted.',
        confirmButtonColor: '#d63384'
    });
}
    }
         
          function ShowData1()
         {
                 var url="/ViewServiceDetails";
                      fetch(url,
                      {
                          method:"POST"
                      })
                      .then(response=>response.text())
                      .then(ans2=>renderAsHTML1(ans2));
         }
         
          function renderAsHTML1(ans2)
          {
                   console.log(ans2);
                   
                    var data=JSON.parse(ans2);
                    var data2=data.ans;
                    
                    var s="";
        
                   s = s+"<div class='table-wrapper'>";
                   s = s+ "<table class='custom-table'>";
                   
                    s=s+"<thead>";
                    s=s+"<tr>";
                    
                    s=s+"<th>Package Name</th>";
                    s=s+"<th>Package Description</th>";
                    s=s+"<th>Package Photo</th>";
                    s=s+"<th>Price</th>";
                    s=s+"<th>Offer Price</th>";
                    s=s+"<th>Type</th>";
                    s=s+"<th>Delete</th>";
                    
                    s=s+"</tr>";
                     s=s+"</thead>";
                  
                  s=s+"<tbody>";
                    for(var i=0; i<data2.length; i++)
                   {
                         var obj=data2[i];
                        
                          s=s+"<tr>";
                             
                             s=s+"<td>"+obj.packagename+"</td>";
                             s=s+"<td>"+obj.packagedesc+"</td>";
                             s=s+`<td><img class='pkg-img' src='${obj.packagephoto}'</td>`;
                             s=s+"<td>"+obj.price+"</td>";
                             s=s+"<td>"+obj.offerprice+"</td>";
                             s=s+"<td>"+obj.type+"</td>";
                             
s=s+`<td><button class='del-btn1' type='button' onclick='deleteData(${obj.packageid})'>Delete</button></td>`;

                         s=s+"</tr>";
                   }
                      s=s+"</tbody>";
                      s=s+"</table>";
                       s=s+ "</div>";
                      console.log(s);
                      document.getElementById("checkdata2").innerHTML=s;
                 }
          
</script>
