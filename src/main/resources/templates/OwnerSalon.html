<style>
    .testimonial-carousel .owl-item::before,
.testimonial-carousel .owl-item::after,
.testimonial-carousel .c-card::before,
.testimonial-carousel .c-card::after
{
    display:none !important;
    content:none !important;
}


.c-card
{
    background:#f8f6f4;
    padding:5px !important;;
    border-radius:20px;
    border-top:1px solid #c08a6d;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,0.06);
    width:100%;
    margin:35px;
}
.c-icon
{
    color:#c79a63;
    font-size:28px;
    margin-bottom:20px;
}

.c-img
{
    width:100%;
    height:260px;
    object-fit:cover;
    border-radius:15px;
    margin-bottom:20px;
}
  .c-btn{
              background:#c08a6d;
              color:white;
              border:none;
              margin-top:30px;
              margin-bottom: 10px;
              padding:10px 28px;
              border-radius:5px;
              transition:0.3s;
             
          }

          .c-btn:hover{
              background:#a97155;
          }
          
          .owl-nav
{
    text-align:center;
    margin-top:25px;
}

.owl-nav button
{
    width:45px;
    height:45px;
    border-radius:50% !important;
    background:#c08a6d !important;
    color:white !important;
    font-size:20px !important;
    margin:0 8px;
    border:none !important;
    transition:0.3s;
}

.owl-nav button:hover
{
    background:#a97155 !important;
}

.owl-nav button i
{
    line-height:45px;
}

.owl-dots
{
    margin-top:15px;
}

</style>
    
<script>

        function SalonDetails(id)
        {
              window.location.href="UserSalonDetail?oid="+id;
        }
        
       function Salons()
       {
              var cid1 =new URLSearchParams(window.location.search).get("cid");
              var formdata=new FormData();
              formdata.append("cid2",cid1);
              var url="/ViewSalons";
              fetch(url,
              {
                   method:"POST",
                   body:formdata
              })
                      .then(response=>response.text())
                      .then(ans=>renderAsHTML(ans));
       }
       
 function renderAsHTML(ans2)
{
      console.log(ans2);

      var s="";

            s=s+"<div class='container-fluid py-2'>";
            s=s+" <div class='container'>";
            s=s+"<div class='text-center wow fadeIn' data-wow-delay='0.2s'>";

      var data=JSON.parse(ans2);

      var data2=data.ans;

    if(data2.length===0)
{
      document.getElementById("ShowSalons").innerHTML=
      `
      <div class='text-center py-5'>
            <h3>No Salons Available</h3>
      </div>
      `;

      return;
}
      console.log(data2);
s += "<div class='row justify-content-center'>";
 for(var i=0; i<data2.length; i++)
{
      var obj=data2[i];
   s+=`
<div class='col-lg-4 col-md-6'>

    <div class='c-card text-center'>

        <img class='c-img'
        src='${obj.shopphoto}' alt=''>

        <button class='c-btn'
        type='button'
        onclick='SalonDetails(${obj.ownerid})'>

            ${obj.shopname}

        </button>

    </div>

</div>
`;
            
}
s += "</div>";
      s=s+"</div>";
      s=s+"</div>";
      s=s+"</div>";

      document.getElementById("ShowSalons").innerHTML=s;
}

 
    
</script>
