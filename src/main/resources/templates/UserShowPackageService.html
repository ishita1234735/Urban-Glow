<script>
    
         function Booking1(pkid1,umode)
         {                                              
                 var unm=document.getElementById("unm").value;
                 var udate=document.getElementById("udate").value;
                 var utime=document.getElementById("utime").value;
                 var uaddress=document.getElementById("uaddress").value;
                 
                if(unm==="" || udate==="" || utime==="" || uaddress==="")
               {
                       Swal.fire({
    title: "Incomplete Form",
    text: "Please fill all the required details.",
    icon: "warning",
    confirmButtonColor: "#d63384",
    background: "#fff"
});
               }
               else
               {
                 var formdata=new FormData();
                 formdata.append("unm",unm);
                 formdata.append("udate",udate);
                 formdata.append("utime",utime);
                 formdata.append("umode",umode);
                 formdata.append("uaddress",uaddress);
                 formdata.append("upackageid",pkid1);
                 
                 var url="/CheckUserBooking";
                fetch(url,
                {
                   method:"POST",
                   body:formdata
                })
               .then(response=>response.text())
                         .then(ans=>renderAsHTML(ans));
                
         }
     }
           function renderAsHTML(ans)
         {
              console.log(ans);
                if(ans==="success")
                {
                     Swal.fire({
            title: "Booking Request Submitted!",
            text: "Your booking request has been sent successfully.",
            icon: "success",
            confirmButtonColor: "#d63384"       
      })
          .then(() =>
            {
                 window.location.href="/";
            });
                }
                else
                {
                      Swal.fire({
            title: "Booking Request Failed",
            text: "Unable to submit your booking request. Please try again",
            icon: "error",
            confirmButtonColor: "#d63384"
      });
                }
         }
         
        function ShowPackageDetail()
        {
                var pid1=new URLSearchParams(window.location.search).get("pid");
                 var formdata=new FormData();
                 formdata.append("pid1",pid1);
                
                 var url="/CheckPackageServiceDetails";
                fetch(url,
                {
                   method:"POST",
                   body:formdata
                })
               .then(response=>response.text())
                         .then(ans=>renderAsHTML1(ans));
                  
                var today = new Date().toISOString().split('T')[0];

                document.getElementById("udate").min = today;
         }
    
         function renderAsHTML1(ans)
         {
             console.log(ans);
                   var data=JSON.parse(ans);
                   var data2=data.ans;   
                   console.log(data2);
                   
                   document.getElementById("pkimage").src=data2[0].packagephoto;
                   document.getElementById("heading1").innerHTML=data2[0].packagename;
                   document.getElementById("phead").innerHTML=data2[0].packagename;
                   document.getElementById("price").innerHTML="₹"+data2[0].price;
                   document.getElementById("oprice").innerHTML=data2[0].offerprice;
                    
                   var desc = data2[0].packagedesc;

                     var s = "";

                    if(desc.includes("•"))
                    {
                        var parts = desc.split("•");
                        s += "<p class='package-heading'>" + parts[0] + "</p>";
                        s += "<ul class='package-points'>";
                         for(var i=1; i<parts.length; i++)
                        {
                                if(parts[i].trim() !== "")
                               {
                                     s += "<li>" + parts[i].trim() + "</li>";
                               }
                         }
                           s += "</ul>";
                     }
                       else
                      {
                          s = "<p class='package-heading'>" + desc + "</p>";
                      }

                   document.getElementById("pkdesc").innerHTML = s;
                   document.getElementById("book1").innerHTML=` <button class='book-btn1' type='button' onclick='paymentlogic(${data2[0].packageid},"online")'>Pay Online</button>`;
                   document.getElementById("book2").innerHTML=` <button class='book-btn1' type='button' onclick='Booking1(${data2[0].packageid},"cash")'>Pay By Cash</button>`;
                   
         }
               
          
</script>
