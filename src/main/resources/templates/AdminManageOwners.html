  .booking-card
{

.booking-table

.booking-table tbody td
{

}

{

}

.s-img1

<script>
    
 function OwnerStatus(ownerid1)
{
        var url="/CheckAdminApproval";

        var formdata=new FormData();
        formdata.append("ownerid1",ownerid1);

        fetch(url,
        {
              method:"POST",
              body:formdata
        })
        .then(response => response.text())
        .then(ans =>
        {
              AdminManageOwners();
        });
}
        
      
        function AdminManageOwners()
        {          
                var url="/CheckAdminManageOwners";
                fetch(url)
               .then(response=>response.text())
                         .then(ans=>renderAsHTML(ans));
        }
        
         function renderAsHTML(ans)
         {
                    console.log(ans); 
                    var data=JSON.parse(ans);
                    
                    var data2=data.ans;
                    
                    console.log(data2);
                    
                    var s="";
         
                    s=s+"<div class='booking-card'>";
                    s=s+ "<table class='booking-table'>";
                    s=s+"<h2 class='text-center mb-4'></h2>";
                    s=s+"<thead>";
                    s=s+"<tr>";

                    s=s+"<th>Owner Name</th>";
//                    s=s+"<th>Owner Email</th>";
                    s=s+"<th>Owner Photo</th>";
                    s=s+"<th>Shop Photo</th>";
                    s=s+"<th>Shop Name</th>";
//                    s=s+"<th>Shop Description</th>";
                    s=s+"<th>Latitude</th>";
                    s=s+"<th>Longitude</th>";
                    s=s+"<th>Start Time</th>";
                    s=s+"<th>End Time</th>";
                    s=s+"<th>Experience</th>";
                    s=s+"<th>Status</th>";
                      
                    s=s+"</tr>";
                    s=s+"</thead>";
                  
                     s=s+"<tbody>";
                    for(var i=0; i<data2.length; i++)
                   {
                         var obj=data2[i];
//                         console.log(obj.ownerid);
                         
                          s=s+"<tr>";
                          
                             s=s+"<td>"+obj.ownername+"</td>";
//                             s=s+"<td>"+obj.owneremail+"</td>";
                             s=s+`<td> <img class='o-img' src='${obj.ownerphoto}'></td>`;
                             s=s+`<td> <img class='s-img1' src='${obj.shopphoto}'></td>`;
                             s=s+"<td>"+obj.shopname+"</td>";
//                             s=s+"<td>"+obj.shopdesc+"</td>";
                             s=s+"<td>"+obj.latitude+"</td>";
                             s=s+"<td>"+obj.longitude+"</td>";
                             s=s+"<td>"+obj.starttime+"</td>";
                             s=s+"<td>"+obj.endtime+"</td>";
                             s=s+"<td>"+obj.experience+"</td>";
                            
                             if(obj.status==="Pending")
                             {
                                  s=s+`<td> <button class='a-btn2' type='button' onclick='OwnerStatus(${obj.ownerid})'>Approve</button> </td>`;
                             }
                            
                             else                                                 
                             {
                                  s=s+`<td> <button class='a-btn2' type='button' onclick='OwnerStatus(${obj.ownerid})'>Pending</button> </td>`;
                             }
                             
                           s=s+"</tr>";
                   }
                      s=s+"</tbody>";
                      s=s+"</table>";
                      s += "</div>";
                      console.log(s);
                      document.getElementById("showadminowners").innerHTML=s;
         }

       
</script>
