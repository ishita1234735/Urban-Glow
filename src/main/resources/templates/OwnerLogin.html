<style>
       .owner-btn4{
              background:#c08a6d;
              color:white;
              border:none;
              margin-top:30px;
              margin-bottom: 10px;
              padding:10px 28px;
              border-radius:5px;
              transition:0.3s;
             display:block;
             margin:auto;
          }

          .owner-btn4:hover{
              background:#a97155;
          }
          
           .owner-btn5{
              background:#c08a6d;
              color:white;
              border:none;
              margin-top:20px;
              margin-bottom: 10px;
              padding:10px 28px;
              border-radius:5px;
              transition:0.3s;
          }

          .owner-btn5:hover{
              background:#a97155;
          }
</style>

<script>

          function Signup1()
          {
                window.location.href="OwnerSignup";
          }
          
        function OwnerLogin()
        {
              var email=document.getElementById("email").value;
              var password=document.getElementById("pass").value;
              
               if(email==="" || password==="")
               {
                      Swal.fire({
    title: "Incomplete Form",
    text: "Please fill Both the required details.",
    icon: "warning",
    confirmButtonColor: "#d63384",
    background: "#fff"
});

               }
              
               else
               {
                 var formdata=new FormData();
                 formdata.append("email",email);
                 formdata.append("pass",password);
                
                 var url="/CheckOwnerSignup";
                fetch(url,
                {
                   method:"POST",
                   body:formdata
                })
               .then(response=>response.text())
                         .then(ans=>renderAsHTML(ans));
             } 
    }
         function renderAsHTML(ans)
         {
                console.log(ans);
               if(ans==="success")
               {
                       Swal.fire({
                title: "Welcome Back!",
                text: "Login Successful",
                icon: "success",
                confirmButtonColor: "#d63384"
            }).then(() =>
            {
                 window.location.href="OwnerHome";
            });
               }
               else
               {
                     Swal.fire({
                title: "Login Failed",
                text: "Invalid Email or Password",
                icon: "error",
                confirmButtonColor: "#d63384"
            }); 
               }
         }

         
</script>
    
    
<body>

    <!-- Navbar Start -->
    <div th:replace="SalonOwnerFragment:: salonownerheader">
    </div>
    <!-- Navbar End -->

    <!-- Hero Start -->
    <div class="container-fluid bg-light page-header py-5 mb-5">

            <h1 class="display-1 animated slideInLeft">Owner Login Panel</h1>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb justify-content-center animated slideInLeft mb-0">
<!--                    <li class="breadcrumb-item"><a class="text-primary" href="#">Home</a></li>
                    <li class="breadcrumb-item"><a class="text-primary" href="#">Pages</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Contact</li>-->
                </ol>
            </nav>
        </div>
    </div>
    <!-- Hero End -->


    <!-- Contact Start -->
        <div class="container-fluid py-5">
        <div class="container">
            <div class="text-center wow fadeIn" data-wow-delay="0.1s">
                <h1 class="font-dancing-script text-primary mb-4"> Owner Login</h1>
                <h1 class=""></h1>
            </div>
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <h5 class="text-center mb-4">   Please Enter your Login Credentials to access the Home Page.<a href="https://htmlcodex.com/contact-form"></a>.</h5>
                    <div class="wow fadeIn" data-wow-delay="0.3s">
                        <form>
                            <div class="row g-3">
                                <div class="col-md-12">
                                    <div class="form-floating">
                                        <input type="email" class="form-control" id="email" placeholder="Enter Email">
                                        <label for="email">Enter Email</label>
                                    </div>
                                </div>
                                
                                <div class="col-md-12">
                                    <div class="form-floating">
                                        <input type="password" class="form-control" id="pass" placeholder="Enter password">
                                        <label for="pass">Enter Password</label>
                                    </div>
                                </div>
                   
                                <div class="col-12">
                                    <button class="owner-btn4" type="button" onclick="OwnerLogin()">Login</button>
                                </div>
                                
                                <div class="d-flex justify-content-center align-items-center gap-3 mt-4">

                                    <h5 class="mb-0">Didn't Have an Account ? </h5>

                                    <button class="owner-btn5" type="button" onclick="Signup1()"> Register
                                    </button>

                                </div>
                                
                            </div>
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Contact End -->

    <div th:replace="SalonOwnerFragment:: salonownerfooter">
