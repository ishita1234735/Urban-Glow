    <style>
       .user-login{
    background:#c08a6d;
    color:white;
    border:none;
    padding:10px 28px;
    border-radius:5px;
    transition:0.3s;

    display:block;
    margin:20px 15px 10px 10px;
}
          .user-login:hover{
              background:#a97155;
          }
          
          .user-login2{
              background:#c08a6d;
              color:white;
              border:none;
              margin-top:30px;
              margin-bottom: 10px;
              padding:10px 28px;
              border-radius:5px;
              transition:0.3s;
             
          }

          .user-login2:hover{
              background:#a97155;
          }
          
    </style>
</head>


<script>

          function Signup()
          {
                window.location.href="UserSignup";
          }
          
        function ULogin()
        {
              var uemail=document.getElementById("uemail").value;
              var upass=document.getElementById("upass").value;
              
               if(uemail==="" || upass==="")
               {
                       Swal.fire({
    title: "Incomplete Form",
    text: "Please fill Both the required details.",
    icon: "warning",
    confirmButtonColor: "#d63384",
    background: "#fff"
});
               }
                           
               else
               {
                 var formdata=new FormData();
                 formdata.append("uemail",uemail);
                 formdata.append("upass",upass);
                
                 var url="/CheckUserLogin";
                fetch(url,
                {
                   method:"POST",
                   body:formdata
                })
               .then(response=>response.text())
                         .then(ans=>renderAsHTML(ans));
             }
    }
         function renderAsHTML(ans)
         {
                console.log(ans);
               if(ans==="success")
               {
                      Swal.fire({
                title: "Welcome Back!",
                text: "Login Successful",
                icon: "success",
                confirmButtonColor: "#d63384"
            }).then(() =>
            {
                 window.location.href="/";
            });
               }
               else
               {
                     Swal.fire({
                title: "Login Failed",
                text: "Invalid Email or Password",
                icon: "error",
                confirmButtonColor: "#d63384"
            }); 
               }
         }

         
      
</script>
    
    
<body>

    <!-- Navbar Start -->
    <div th:replace=" UserFragment:: userheader">
    </div>

    <!-- Hero Start -->
    <div class="container-fluid bg-light page-header py-5 mb-5">

            <h1 class="display-1 animated slideInLeft"> Login Form</h1>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb justify-content-center animated slideInLeft mb-0">
<!--                    <li class="breadcrumb-item"><a class="text-primary" href="#">Home</a></li>
                    <li class="breadcrumb-item"><a class="text-primary" href="#">Pages</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Contact</li>-->
                </ol>
            </nav>
        </div>
    </div>
    <!-- Hero End -->


    <!-- Contact Start -->
        <div class="container-fluid py-5">
        <div class="container">
            <div class="text-center wow fadeIn" data-wow-delay="0.1s">
                <h1 class="font-dancing-script text-primary mb-4">Login Form </h1>
                <h1 class="mb-4"></h1>
            </div>
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <h5 class="text-center mb-4">   Please Enter your Login Credentials below..<a href="https://htmlcodex.com/contact-form"></a>.</h5>
                    <div class="wow fadeIn" data-wow-delay="0.3s">
                        <form>
                            <div class="row g-3">
                                <div class="col-md-12">
                                    <div class="form-floating">
                                        <input type="email" class="form-control" id="uemail" placeholder="Enter Email">
                                        <label for="uemail">Enter Email</label>
                                    </div>
                                </div>
                                
                                <div class="col-md-12">
                                    <div class="form-floating">
                                        <input type="password" class="form-control" id="upass" placeholder="Enter password">
                                        <label for="upass">Enter Password</label>
                                    </div>
                                </div>
                   
                                <div class="col-12">
                                    <button class="user-login" type="button" onclick="ULogin()">Login</button>
                                </div>
                                
                                 <div class="d-flex align-items-center gap-2">
                                  <div class="col-md-6">
                                    <div class="form-floating">
                                        <h5>Didn't Have an Account ?  -></h5>
                                    </div>
                                </div>
                                
                                 <div class="col-2">
                                    <button class="user-login2" type="button" onclick="Signup()">Signup</button>
                                 </div>
                                
                                 </div>
                                
                            </div>
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
