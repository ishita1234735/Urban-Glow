<script>
        
        function AddPhotos()
        {
              var photo=document.getElementById("photos").files[0];
               if(!photo)
               {
                      Swal.fire({
    title: "Incomplete Form",
    text: "Kindly Add Photo.",
    icon: "warning",
    confirmButtonColor: "#d63384",
    background: "#fff"
});

               }
              
               else
               {
                 var formdata=new FormData();
                 formdata.append("ophoto",photo);
                
                 var url="/AddOwnerPhoto";
                 fetch(url,
                 {
                   method:"POST",
                   body:formdata
                 })
                .then(response=>response.text())
                         .then(ans=>renderAsHTML(ans));
             }
    }
    
         function renderAsHTML(ans)
         {
                console.log(ans);
               if(ans==="success")
               {
                       Swal.fire({
            title: "Success!",
            text: "Photo Added Successfully",
            icon: "success",
            confirmButtonColor: "#d63384"
      });
                 ShowData2();
               }
               
               else
               {
                     Swal.fire({
            title: "Upload Failed",
            text: "Photo could not be added successfully.",
            icon: "error",
            confirmButtonColor: "#d63384"
      });
               }
         }
          
                function deleteData(id)
                {
                         console.log(id);
                         var formdata=new FormData();
                         formdata.append("id_del1",id);
                         
                         var url="/DeletePhoto";
                        
                         fetch(url,
                        {
                             method:"POST",
                             body:formdata
                        })
                                .then(response=>response.text())
                                .then(ans3=>renderHTML(ans3));
                }
                
               function renderHTML(ans3)
               {
                    if(ans3 === "success")
{
    Swal.fire({
        icon: 'success',
        title: 'Deleted!',
        text: 'Photo deleted successfully.',
        confirmButtonColor: '#d63384'
    });

    ShowData2();
}
else
{
    Swal.fire({
        icon: 'error',
        title: 'Error!',
        text: 'Photo could not be deleted.',
        confirmButtonColor: '#d63384'
    });
}
               }
               
                
                
          function ShowData2()
         {
                 var url="/ViewPhotos";
                      fetch(url)
                      .then(response=>response.text())
                      .then(ans2=>renderAsHTML2(ans2));
         }
         
          function renderAsHTML2(ans2)
          {
                    console.log(ans2);  
                    var data=JSON.parse(ans2);
                    var data2=data.ans;
                    var s="";
         
                    s=s+"<div class='ophotos'>";
                    s=s+ "<table class='ophotos-table'>";
                    
                    s=s+"<thead>";
                    
                    s=s+"<tr>";
                    s=s+"<th>PhotoId</th>";
//                    s=s+"<th>OwnerId</th>";
                    s=s+"<th>Photo</th>";
                    s=s+"<th>Delete</th>";
                    s=s+"</tr>";
                     
                    s=s+"</thead>";
                  
                    s=s+"<tbody>";
                    for(var i=0; i<data2.length; i++)
                    {
                         var obj=data2[i];
                        
                          s=s+"<tr>";
                             
                             s=s+"<td>"+obj.photoid+"</td>";
//                             s=s+"<td>"+obj.ownerid+"</td>";
                             //console.log(obj.shopphoto);
                             s=s+`<td> <img class='shop-img1' src='${obj.photo}'></td>`;

                             s=s+`<td> <button class='delete-btn1' type='button' onclick='deleteData(${obj.photoid})'>Delete </button> </td>`;
                             
                         s=s+"</tr>";
                   }
                      s=s+"</tbody>";
                      s=s+"</table>";
                      s=s+"</div>";
                      console.log(s);
                      document.getElementById("check2").innerHTML=s;
                 }
          
     
    
</script>
