    <style>
        .user-btn1{
    background:#c08a6d;
    color:white;
    border:none;
    padding:10px 28px;
    border-radius:5px;
    transition:0.3s;

    display:block;
    margin:20px 15px 10px 10px;
}
          .user-btn1:hover{
              background:#a97155;
          }
          
          .user-btn2{
              background:#c08a6d;
              color:white;
              border:none;
              margin-top:30px;
              margin-bottom: 10px;
              padding:10px 28px;
              border-radius:5px;
              transition:0.3s;

    </style>

<script>

          function Login21()
          {
                window.location.href="UserLogin";
          }
          
        function USignup()
        {
              var uname=document.getElementById("uname").value;
              var uemail=document.getElementById("uemail").value;
              var upass=document.getElementById("upass").value;
              var uphoto=document.getElementById("uphoto").files[0];
              var uaddress=document.getElementById("uaddress").value;
              
               var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
               if(uname==="" || uemail==="" || upass==="" || !uphoto || uaddress==="")
               {
                     
                       Swal.fire({
    title: "Incomplete Form",
    text: "Please fill in All the required details.",
    icon: "warning",
    confirmButtonColor: "#d63384",
    background: "#fff"
});
               }
               else if(!emailPattern.test(uemail))
{
      Swal.fire({
          title: "Invalid Email",
          text: "Please enter a valid email address.",
          icon: "error",
          confirmButtonColor: "#d63384",
          background: "#fff"
      });
}

              
               else
               {
                 var formdata=new FormData();
                 formdata.append("uname",uname);
                 formdata.append("uemail",uemail);
                 formdata.append("upass",upass);
                 formdata.append("uphoto",uphoto);
                 formdata.append("uaddress",uaddress);
                 
                 var url="/CheckUserSignup";
                fetch(url,
                {
                   method:"POST",
                   body:formdata
                })
               .then(response=>response.text())
                         .then(ans=>renderAsHTML(ans));
             }
    }
         function renderAsHTML(ans)
         {
                console.log(ans);
               if(ans==="success")
               {
                     Swal.fire({
            title: "Account Created!",
            text: "Signup Successful",
            icon: "success",
            confirmButtonColor: "#d63384"
      }).then(() =>
            {
                 window.location.href="UserLogin";
            });
               }
               else
               {
                     Swal.fire({
            title: "Signup Failed",
            text: "Unable to create account. Please try again.",
            icon: "error",
            confirmButtonColor: "#d63384"
      });
               }
         }
         
         
</script>

                                 <div class="col-md-12">

                                        <input type="file" class="form-control" id="uphoto" placeholder="Enter photo">

                                  <div class="col-md-12">
