<script>
    
 function UserStatus(bookingid)
{
        var url="/CheckOwnerApproval";

        var formdata=new FormData();
        formdata.append("bookingid",bookingid);

        fetch(url,
        {
              method:"POST",
              body:formdata
        })
        .then(response => response.text())
        .then(ans =>
        {
               OwnerBooking();
        });
}
     
         function OwnerBooking2()
         {
                var url="/CheckOwnerBookings2";
                fetch(url,
                {
                   method:"POST"
                })
               .then(response=>response.text())
                         .then(ans=>renderAsHTML(ans));
         }
     
        function OwnerBooking()
        {          
                var url="/CheckOwnerBookings";
                fetch(url,
                {
                   method:"POST"
                })
               .then(response=>response.text())
                         .then(ans=>renderAsHTML(ans));
        }
        
         function renderAsHTML(ans)
         {
                    console.log("Ishita");
                    console.log(ans); 
                    var data=JSON.parse(ans);
                    
                    var data2=data.ans;
                    
                    console.log(data2);
                    
                    var s="";
         
                    s=s+"<div class='booking-card'>";
                    s=s+ "<table class='booking-table'>";
                    s=s+"<h2 class='text-center mb-4'></h2>";
                    s=s+"<thead>";
                    s=s+"<tr>";
                    
//                    s=s+"<th>PackageID</th>";
                   
                    s=s+"<th>User Name</th>";
                    s=s+"<th>User Email</th>";
                    s=s+"<th>Booking Date</th>";
                    s=s+"<th>Booking Time</th>";
                    s=s+"<th>Mode of Payment</th>";
                    s=s+"<th>Address</th>";
                    s=s+"<th>Status</th>";
                    
                    s=s+"</tr>";
                     s=s+"</thead>";
                  
                     s=s+"<tbody>";
                    for(var i=0; i<data2.length; i++)
                   {
                         var obj=data2[i];
                         
                          s=s+"<tr>";
                             
//                             s=s+"<td>"+obj.packageid+"</td>";
                         
                             s=s+"<td>"+obj.username+"</td>";
                             s=s+"<td>"+obj.useremail+"</td>";
                             s=s+"<td>"+obj.bookingdate+"</td>";
                             s=s+"<td>"+obj.bookingtime+"</td>";
                             s=s+"<td>"+obj.modeofpayment+"</td>";
                             s=s+"<td>"+obj.address+"</td>";
//                             s += "<td><span class='status-badge'>"+ obj.status+"</span></td>";
//                            
//                             //s=s+`<td> <button class='u-btn2' type='button' onclick='BookHistory(${obj.userid})'>Show Booking history</button> </td>`;
                             
                              if(obj.status==="Pending")
                             {
                                  s=s+`<td> <button class='o-btn2' type='button' onclick='UserStatus(${obj.bookingid})'>Approve</button> </td>`;
                             }
                            
                             else                                                 
                             {
                                  s=s+`<td> <button class='o-btn2' type='button' onclick='UserStatus(${obj.bookingid})'>Pending</button> </td>`;
                             }
                             
                           s=s+"</tr>";
                   }
                      s=s+"</tbody>";
                      s=s+"</table>";
                      s += "</div>";
                      console.log(s);
                      document.getElementById("showownerbooking").innerHTML=s;
         }

</script>
